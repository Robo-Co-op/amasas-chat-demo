name: (temp) Inspect/set Supabase auth config

# One-off utility to read (and optionally fix) the Amasas Supabase project's
# Site URL / Redirect URLs allow-list via the Management API, to diagnose
# why invite links land on a plain sign-in form instead of set-password.
# Safe to delete once used.
on:
  workflow_dispatch:
    inputs:
      apply_uri_allow_list:
        description: "If set (non-empty), PATCHes uri_allow_list to this comma-separated value. Leave empty to only read."
        type: string
        default: ""

jobs:
  supabase-auth-config:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jcokpgmqmtxefzjjenrx
    steps:
      - name: Read current auth config
        run: |
          HTTP_STATUS=$(curl -sS -o auth_config.json -w "%{http_code}" -X GET "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          echo "HTTP status: $HTTP_STATUS"
          node -e '
              const fs = require("fs");
              const c = JSON.parse(fs.readFileSync("auth_config.json", "utf8"));
              console.log("keys:", Object.keys(c).sort().join(", "));
              const wanted = Object.keys(c).filter(k => /site_url|uri_allow|redirect|allow_list/i.test(k));
              for (const k of wanted) console.log(k, "=", JSON.stringify(c[k]));
            '

      - name: Set uri_allow_list (only if apply_uri_allow_list input is non-empty)
        if: ${{ inputs.apply_uri_allow_list != '' }}
        run: |
          RESP=$(curl -sS -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uri_allow_list\": \"${{ inputs.apply_uri_allow_list }}\"}")
          echo "$RESP" > patch_result.json
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("patch_result.json", "utf8"));
            if (p.error || p.message) { console.error("ERROR:", JSON.stringify(p, null, 2)); process.exit(1); }
            console.log("updated URI_ALLOW_LIST:", p.URI_ALLOW_LIST);
          '
