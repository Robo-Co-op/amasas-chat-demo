name: Deploy amasas-ai to Vercel (production)

# Production deploys for the "amasas-ai" Vercel project (the one serving the
# real production domain, amasas-chat-demo-7bk6.vercel.app -- project NAME
# doesn't match the domain/repo name) go through this workflow instead of
# Vercel's own Git integration, so a merge to main is reviewable/auditable
# like the Supabase migrations workflow.
#
# Vercel's Git integration still auto-builds PREVIEW deployments for every
# push/PR exactly as before — only the production build on `main` moves
# here. That requires a one-time manual step in the Vercel dashboard so
# Vercel doesn't ALSO deploy production on the same push (see README):
# Project Settings -> Git -> Ignore Build Step, set to:
#   if [ "$VERCEL_GIT_COMMIT_REF" = "main" ]; then exit 0; else exit 1; fi
#
# The other two Vercel projects deploying from this repo (amasas-chat-demo,
# amasas-chat-demo-main) are unaffected and keep deploying directly via Vercel.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Slack bot credentials live in GitHub secrets; upsert them into the
      # Vercel project's production env (REST API) before deploying, so the
      # deployed /api/slack/events function can read them. `vercel env add`
      # failed here with "Could not retrieve Project Settings", so this calls
      # the API directly and logs the HTTP error (never the value) on failure.
      # Only the two Slack values are synced; never fails the web deploy.
      - name: Sync Slack secrets to Vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: |
          query="upsert=true"
          case "$VERCEL_ORG_ID" in team_*) query="$query&teamId=$VERCEL_ORG_ID" ;; esac
          for name in SLACK_BOT_TOKEN SLACK_SIGNING_SECRET; do
            value="${!name}"
            if [ -z "$value" ]; then echo "$name not set in GitHub secrets; skipping"; continue; fi
            body=$(jq -n --arg k "$name" --arg v "$value" '{key: $k, value: $v, type: "encrypted", target: ["production"]}')
            code=$(curl -s -o resp.json -w '%{http_code}' -X POST               "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?$query"               -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "$body")
            if [ "$code" -lt 300 ]; then
              echo "$name synced"
            else
              echo "::warning::$name sync failed: HTTP $code $(jq -c '{code: .error.code, message: .error.message}' resp.json 2>/dev/null)"
            fi
            rm -f resp.json
          done

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
