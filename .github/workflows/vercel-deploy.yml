name: Deploy amasas-chat-demo to Vercel (production)

# Production deploys for the amasas-chat-demo Vercel project go through this
# workflow instead of Vercel's own Git integration, so a merge to main is
# reviewable/auditable like the Supabase migrations workflow.
#
# Vercel's Git integration still auto-builds PREVIEW deployments for every
# push/PR exactly as before — only the production build on `main` moves
# here. That requires a one-time manual step in the Vercel dashboard so
# Vercel doesn't ALSO deploy production on the same push (see README):
# Project Settings -> Git -> Ignore Build Step, set to:
#   if [ "$VERCEL_GIT_COMMIT_REF" = "main" ]; then exit 0; else exit 1; fi
#
# The other two Vercel projects deploying from this repo (amasas-chat-demo-main,
# amasas-ai) are unaffected and keep deploying directly via Vercel.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
