name: Deploy amasas-ai to Vercel (production)

# Production deploys for the "amasas-ai" Vercel project (the one serving the
# real production domain, amasas-chat-demo-7bk6.vercel.app -- project NAME
# doesn't match the domain/repo name) go through this workflow instead of
# Vercel's own Git integration, so a merge to main is reviewable/auditable
# like the Supabase migrations workflow.
#
# Vercel's Git integration still auto-builds PREVIEW deployments for every
# push/PR exactly as before — only the production build on `main` moves
# here. That requires a one-time manual step in the Vercel dashboard so
# Vercel doesn't ALSO deploy production on the same push (see README):
# Project Settings -> Git -> Ignore Build Step, set to:
#   if [ "$VERCEL_GIT_COMMIT_REF" = "main" ]; then exit 0; else exit 1; fi
#
# The other two Vercel projects deploying from this repo (amasas-chat-demo,
# amasas-chat-demo-main) are unaffected and keep deploying directly via Vercel.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # api/admin/invite.py is a Python function; `vercel build` needs Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vercel CLI
        run: npm install --global vercel@64.5.0

      # Slack bot credentials live in GitHub secrets and are written to the
      # Vercel project's production env through the REST API. Each existing
      # copy is deleted and recreated as "sensitive": the "encrypted"
      # production copies became unreadable (GET 404), which made
      # `vercel pull` fail with "Production Project Environment Variable not
      # found". This runs before `vercel pull` for that reason. Values are
      # never logged.
      #
      # NOREPLY_EMAIL_PWD (the noreply@robocoop.org SMTP password) goes the same
      # way: api/admin/invite.py sends admin invite emails with it.
      - name: Sync Slack and SMTP secrets to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          NOREPLY_EMAIL_PWD: ${{ secrets.NOREPLY_EMAIL_PWD }}
        run: |
          api="https://api.vercel.com"
          team=""
          case "$VERCEL_ORG_ID" in team_*) team="teamId=$VERCEL_ORG_ID" ;; esac
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          curl -sf "${auth[@]}" "$api/v10/projects/$VERCEL_PROJECT_ID/env?$team" > envs.json
          for name in SLACK_BOT_TOKEN SLACK_SIGNING_SECRET NOREPLY_EMAIL_PWD; do
            value="${!name}"
            if [ -z "$value" ]; then echo "$name not set in GitHub secrets; skipping"; continue; fi
            for id in $(jq -r --arg k "$name" '.envs[] | select(.key == $k) | .id' envs.json); do
              code=$(curl -s -o resp.json -w '%{http_code}' -X DELETE "${auth[@]}" "$api/v9/projects/$VERCEL_PROJECT_ID/env/$id?$team")
              echo "$name: deleted old copy $id (HTTP $code)"
            done
            body=$(jq -n --arg k "$name" --arg v "$value" '{key: $k, value: $v, type: "sensitive", target: ["production"]}')
            code=$(curl -s -o resp.json -w '%{http_code}' -X POST "${auth[@]}" -H "Content-Type: application/json" \
              "$api/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&$team" -d "$body")
            if [ "$code" -ge 300 ]; then
              echo "::error::$name sync failed: HTTP $code $(jq -c '{code: .error.code, message: .error.message}' resp.json 2>/dev/null)"
              rm -f resp.json envs.json; exit 1
            fi
            echo "$name synced"
          done
          rm -f resp.json envs.json

      # The Supabase service key must change together with the project URL in
      # the code, and team Developers cannot edit production env vars in the
      # dashboard, so the deploy itself sets it. Unlike the Slack step this one
      # fails the deploy: shipping code with a key for the wrong project would
      # silently break every DB write.
      - name: Sync Supabase service key to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_AMANOWA }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then echo "::error::GitHub secret SUPABASE_SERVICE_KEY_AMANOWA is not set"; exit 1; fi
          case "$SERVICE_KEY" in sb_secret_*) ;; *) echo "::error::SUPABASE_SERVICE_KEY_AMANOWA is not an sb_secret_ key"; exit 1 ;; esac
          query="upsert=true"
          case "$VERCEL_ORG_ID" in team_*) query="$query&teamId=$VERCEL_ORG_ID" ;; esac
          body=$(jq -n --arg v "$SERVICE_KEY" '{key: "SUPABASE_SERVICE_KEY", value: $v, type: "sensitive", target: ["production", "preview"]}')
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?$query" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "$body")
          if [ "$code" -ge 300 ]; then
            echo "::error::SUPABASE_SERVICE_KEY sync failed: HTTP $code $(jq -c '{code: .error.code, message: .error.message}' resp.json 2>/dev/null)"
            rm -f resp.json; exit 1
          fi
          rm -f resp.json
          echo "SUPABASE_SERVICE_KEY synced"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
