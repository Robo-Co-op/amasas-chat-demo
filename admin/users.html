<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理者 | AMASAS Admin</title>
<script>
// This repo deploys under 3 separate Vercel accounts (see index.html) --
// redirect visitors on the two we don't control to the canonical domain.
// Preserves the path, so /admin/* deep links keep working after redirect.
if (/-robo-co-op-team\.vercel\.app$/.test(location.hostname) || /-dimdimlians-projects\.vercel\.app$/.test(location.hostname)) {
  location.replace("https://amasas-chat-demo-7bk6.vercel.app" + location.pathname + location.search + location.hash);
}
</script>
<script>document.documentElement.lang = localStorage.getItem("amasas_admin_lang") || "ja";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/admin.css">
</head>
<body>
<script src="shared/i18n.js"></script>
<script src="shared/admin.js"></script>
<script>
const ROLES = ["owner", "admin", "editor", "viewer"];
const CAPS = () => [
  [I18n.t("users.cap.view_basics"), true, true, true, true],
  [I18n.t("users.cap.view_knowledge"), true, true, true, true],
  [I18n.t("users.cap.edit_knowledge"), true, true, true, false],
  [I18n.t("users.cap.manage_admins"), true, "※", false, false],
  [I18n.t("users.cap.delete_admins"), true, false, false, false],
  [I18n.t("users.cap.settings"), true, true, false, false],
  [I18n.t("users.cap.audit_log"), true, true, false, false],
];

(async function () {
  document.title = I18n.t("users.title") + " | AMASAS Admin";
  const ctx = await Admin.renderShell({ page: "users", title: I18n.t("users.title"), sub: I18n.t("users.sub") });
  if (!ctx) return;
  const content = document.getElementById("content");
  const canManage = Admin.can(ctx.role, "users");

  content.innerHTML = `
    <div id="list"><div class="loading">${I18n.t("common.loading")}</div></div>

    ${canManage ? `
    <h2 class="section">${I18n.t("users.invite_heading")}</h2>
    <div class="card">
      <form id="invite-form" class="formgrid">
        <div class="field"><label>${I18n.t("users.field.email")}</label><input type="email" id="inv-email" required /></div>
        <div class="field"><label>${I18n.t("users.field.display_name")}</label><input type="text" id="inv-name" /></div>
        <div class="field"><label>${I18n.t("users.field.role")}</label>
          <select id="inv-role">
            ${ROLES.filter((r) => !(ctx.role === "admin" && (r === "owner" || r === "admin"))).map((r) => `<option value="${r}">${r}</option>`).join("")}
          </select>
        </div>
        <div class="field" style="align-self:end;"><button class="btn primary" type="submit">${I18n.t("users.invite_submit")}</button></div>
      </form>
      <div id="inv-msg"></div>
      <p style="font-size:12px;color:var(--ink-2);margin-top:4px;">${I18n.t("users.invite_note")}</p>
    </div>
    ` : ""}

    <h2 class="section">${I18n.t("users.permissions_heading")}</h2>
    <div class="tablewrap"><table class="dtable">
      <thead><tr><th>${I18n.t("users.th.capability")}</th><th>owner</th><th>admin</th><th>editor</th><th>viewer</th></tr></thead>
      <tbody>${CAPS().map((row) => `<tr><td>${Admin.esc(row[0])}</td>${row.slice(1).map((v) => `<td>${v === true ? "✓" : v === "※" ? I18n.t("users.cap.admin_restricted") : "—"}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>
  `;

  await loadList();

  if (canManage) {
    document.getElementById("invite-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("inv-msg");
      msg.innerHTML = "";
      const email = document.getElementById("inv-email").value.trim();
      const displayName = document.getElementById("inv-name").value.trim();
      const role = document.getElementById("inv-role").value;
      try {
        const s = await Admin.ensureToken();
        const r = await fetch("/api/admin/invite", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${s.access_token}` },
          body: JSON.stringify({ email, displayName, role }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || I18n.t("users.invite_failed"));
        Admin.toast(I18n.t("users.invite_sent"), "ok");
        document.getElementById("invite-form").reset();
        await loadList();
      } catch (err) {
        msg.innerHTML = `<div class="errbox">${Admin.esc(err.message)}</div>`;
      }
    });
  }

  async function loadList() {
    const list = document.getElementById("list");
    list.innerHTML = `<div class="loading">${I18n.t("common.loading")}</div>`;
    try {
      const users = await Admin.rpc("admin_list_users");
      list.innerHTML = `
        <div class="tablewrap"><table class="dtable">
          <thead><tr><th>${I18n.t("users.th.email")}</th><th>${I18n.t("users.th.display_name")}</th><th>${I18n.t("users.th.role")}</th><th>${I18n.t("users.th.status")}</th><th>${I18n.t("users.th.last_login")}</th><th>${I18n.t("users.th.created")}</th>${canManage ? "<th></th>" : ""}</tr></thead>
          <tbody id="users-tbody"></tbody>
        </table></div>
      `;
      const tbody = document.getElementById("users-tbody");
      const isOwner = ctx.role === "owner";
      users.forEach((u) => {
        const tr = document.createElement("tr");
        const lockedForCaller = ctx.role === "admin" && (u.role === "owner" || u.role === "admin") && u.id !== ctx.profile.id;
        const isSelf = u.id === ctx.profile.id;
        const roleCell = canManage && !lockedForCaller
          ? `<select data-id="${u.id}" class="role-select">${ROLES.map((r) => `<option value="${r}" ${r === u.role ? "selected" : ""}>${r}</option>`).join("")}</select>`
          : `<span class="badge role-${Admin.esc(u.role)}">${Admin.esc(u.role)}</span>`;
        const actions = [];
        if (canManage && !lockedForCaller) {
          actions.push(`<button class="btn ghost sm" data-act="toggle" data-id="${u.id}" data-active="${u.is_active}" data-role="${u.role}">${u.is_active ? I18n.t("users.action.deactivate") : I18n.t("users.action.activate")}</button>`);
        }
        if (isOwner && !isSelf) {
          actions.push(`<button class="btn ghost sm danger" data-act="delete" data-id="${u.id}" data-email="${Admin.esc(u.email)}">${I18n.t("users.delete.button")}</button>`);
        }
        tr.innerHTML = `
          <td>${Admin.esc(u.email)}</td>
          <td>${Admin.esc(u.display_name || "—")}</td>
          <td>${roleCell}</td>
          <td>${u.is_active ? `<span class="badge ok">${I18n.t("users.status.active")}</span>` : `<span class="badge ng">${I18n.t("users.status.inactive")}</span>`}</td>
          <td>${Admin.fmtDate(u.last_login_at)}</td>
          <td>${Admin.fmtDate(u.created_at)}</td>
          ${canManage ? `<td><div style="display:flex;gap:6px;">${actions.join("")}</div></td>` : ""}
        `;
        tbody.appendChild(tr);
      });

      if (canManage) {
        tbody.querySelectorAll(".role-select").forEach((sel) => {
          sel.addEventListener("change", async () => {
            const u = users.find((x) => x.id === sel.dataset.id);
            try {
              await Admin.rpc("admin_set_user", { target_id: u.id, new_role: sel.value, new_active: u.is_active });
              Admin.toast(I18n.t("users.updated"), "ok");
              await loadList();
            } catch (err) {
              Admin.toast(err.message, "err");
              sel.value = u.role;
            }
          });
        });
        tbody.querySelectorAll('button[data-act="toggle"]').forEach((btn) => {
          btn.addEventListener("click", async () => {
            const nextActive = btn.dataset.active !== "true";
            const ok = await Admin.confirmModal({
              title: nextActive ? I18n.t("users.confirm_activate_title") : I18n.t("users.confirm_deactivate_title"),
              body: `<p style="font-size:13px;color:var(--ink-2);">${I18n.t("users.confirm_deactivate_body")}</p>`,
              confirmLabel: nextActive ? I18n.t("users.action.activate") : I18n.t("users.action.deactivate"),
              danger: !nextActive,
            });
            if (!ok) return;
            try {
              await Admin.rpc("admin_set_user", { target_id: btn.dataset.id, new_role: btn.dataset.role, new_active: nextActive });
              Admin.toast(I18n.t("users.updated"), "ok");
              await loadList();
            } catch (err) {
              Admin.toast(err.message, "err");
            }
          });
        });
        tbody.querySelectorAll('button[data-act="delete"]').forEach((btn) => {
          btn.addEventListener("click", async () => {
            const ok = await Admin.confirmModal({
              title: I18n.t("users.delete.title", { email: btn.dataset.email }),
              body: `<p style="font-size:13px;color:var(--ink-2);">${I18n.t("users.delete.body")}</p>`,
              confirmLabel: I18n.t("users.delete.confirm"),
              danger: true,
            });
            if (!ok) return;
            try {
              const s = await Admin.ensureToken();
              const r = await fetch("/api/admin/delete-user", {
                method: "POST",
                headers: { "Content-Type": "application/json", Authorization: `Bearer ${s.access_token}` },
                body: JSON.stringify({ target_id: btn.dataset.id }),
              });
              const data = await r.json();
              if (!r.ok) throw new Error(data.error || I18n.t("users.delete.failed"));
              Admin.toast(data.warning || I18n.t("users.delete.done"), data.warning ? "err" : "ok");
              await loadList();
            } catch (err) {
              Admin.toast(err.message, "err");
            }
          });
        });
      }
    } catch (err) {
      list.innerHTML = `<div class="errbox">${I18n.t("common.error_prefix", { msg: Admin.esc(err.message) })}</div>`;
    }
  }
})();
</script>
</body>
</html>
