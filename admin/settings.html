<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>設定 | AMASAS Admin</title>
<script>
// This repo deploys under 3 separate Vercel accounts (see index.html) --
// redirect visitors on the two we don't control to the canonical domain.
// Preserves the path, so /admin/* deep links keep working after redirect.
if (/-robo-co-op-team\.vercel\.app$/.test(location.hostname) || /-dimdimlians-projects\.vercel\.app$/.test(location.hostname)) {
  location.replace("https://amasas-chat-demo-7bk6.vercel.app" + location.pathname + location.search + location.hash);
}
</script>
<script>document.documentElement.lang = localStorage.getItem("amasas_admin_lang") || "ja";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/admin.css">
</head>
<body>
<script src="shared/i18n.js"></script>
<script src="shared/admin.js"></script>
<script>
(async function () {
  document.title = I18n.t("settings.title") + " | AMASAS Admin";
  const ctx = await Admin.renderShell({ page: "settings", title: I18n.t("settings.title"), sub: I18n.t("settings.sub") });
  if (!ctx) return;
  const content = document.getElementById("content");

  content.innerHTML = `
    <h2 class="section" style="margin-top:0;">${I18n.t("settings.maintenance_heading")}</h2>
    <div class="card" id="maint-card"><div class="loading">${I18n.t("common.loading")}</div></div>

    <h2 class="section">${I18n.t("settings.runtime_heading")}</h2>
    <div class="card" id="health-card"><div class="loading">${I18n.t("common.loading")}</div></div>
    <p style="font-size:12px;color:var(--ink-2);margin-top:8px;">
      ${I18n.t("settings.runtime_note")}
    </p>
  `;

  await loadMaintenance();
  await loadHealth();

  async function loadMaintenance() {
    const card = document.getElementById("maint-card");
    try {
      const settings = await Admin.rpc("admin_list_settings");
      const row = settings.find((s) => s.key === "maintenance_mode");
      const v = (row && row.value) || { enabled: false, message: "" };
      card.innerHTML = `
        <div class="field" style="display:flex;align-items:center;gap:10px;max-width:240px;">
          <input type="checkbox" id="maint-enabled" ${v.enabled ? "checked" : ""} style="width:auto;" />
          <label style="margin:0;">${I18n.t("settings.maintenance_enable")}</label>
        </div>
        <div class="field">
          <label>${I18n.t("settings.maintenance_message_label")}</label>
          <textarea id="maint-message" placeholder="${I18n.t("settings.maintenance_message_placeholder")}">${Admin.esc(v.message || "")}</textarea>
        </div>
        <button class="btn primary" id="maint-save">${I18n.t("common.save")}</button>
        <span id="maint-msg" style="margin-left:10px;font-size:12px;color:var(--ink-2);"></span>
      `;
      document.getElementById("maint-save").addEventListener("click", async () => {
        const enabled = document.getElementById("maint-enabled").checked;
        const message = document.getElementById("maint-message").value.trim();
        try {
          await Admin.rpc("admin_set_setting", { setting_key: "maintenance_mode", setting_value: { enabled, message } });
          Admin.toast(I18n.t("settings.saved"), "ok");
        } catch (err) {
          Admin.toast(err.message, "err");
        }
      });
    } catch (err) {
      card.innerHTML = `<div class="errbox">${I18n.t("common.error_prefix", { msg: Admin.esc(err.message) })}</div>`;
    }
  }

  async function loadHealth() {
    const card = document.getElementById("health-card");
    try {
      const s = await Admin.ensureToken();
      const r = await fetch("/api/admin/health", { headers: { Authorization: `Bearer ${s.access_token}` } });
      if (!r.ok) throw new Error(I18n.t("settings.health_fetch_failed"));
      const h = await r.json();
      const chip = (ok, label) => `<span class="badge ${ok ? "ok" : "ng"}">${ok ? "✓" : "✕"} ${Admin.esc(label)}</span>`;
      card.innerHTML = `
        <div class="formgrid">
          <div><label>${I18n.t("settings.field.vercel_env")}</label>${Admin.esc(h.vercelEnv)}</div>
          <div><label>${I18n.t("settings.field.gemini_model")}</label><span class="mono">${Admin.esc(h.geminiModel)}</span></div>
          <div><label>${I18n.t("settings.field.fallback_model")}</label><span class="mono">${Admin.esc(h.geminiFallbackModel)}</span></div>
          <div><label>${I18n.t("settings.field.data_layer")}</label><span class="mono">${Admin.esc(h.dataLayer)}</span></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
          ${chip(h.geminiKeyConfigured, I18n.t("settings.chip.gemini_key"))}
          ${chip(h.serviceKeyConfigured, I18n.t("settings.chip.service_key"))}
          ${chip(h.dbReachable, I18n.t("settings.chip.db_reachable"))}
        </div>
      `;
    } catch (err) {
      card.innerHTML = `<div class="errbox">${I18n.t("common.error_prefix", { msg: Admin.esc(err.message) })}</div>`;
    }
  }
})();
</script>
</body>
</html>
