<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ログイン | AMASAS Admin</title>
<script>
// This repo deploys under 3 separate Vercel accounts (see index.html) --
// redirect visitors on the two we don't control to the canonical domain.
// Preserves the path, so /admin/* deep links keep working after redirect.
if (/-robo-co-op-team\.vercel\.app$/.test(location.hostname) || /-dimdimlians-projects\.vercel\.app$/.test(location.hostname)) {
  location.replace("https://amasas-chat-demo-7bk6.vercel.app" + location.pathname + location.search + location.hash);
}
</script>
<script>document.documentElement.lang = localStorage.getItem("amasas_admin_lang") || "ja";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/admin.css">
</head>
<body>
<div class="center-page">
  <div class="card authcard" id="card">
    <div class="brand">AMASAS<small>Admin Console</small></div>
    <div class="langswitch" id="langswitch">
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <div id="cardbody"></div>
  </div>
</div>
<script src="shared/i18n.js"></script>
<script src="shared/admin.js"></script>
<script>
(function () {
  document.title = I18n.t("login.title");
  const cardbody = document.getElementById("cardbody");

  const langswitch = document.getElementById("langswitch");
  langswitch.querySelectorAll("[data-lang]").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.lang === I18n.getLang());
    btn.addEventListener("click", () => I18n.setLang(btn.dataset.lang));
  });

  // Invite/recovery links land here as #access_token=...&refresh_token=...&type=invite
  // — but an expired/already-used/malformed link lands as #error=...&error_description=...
  // instead, with no access_token at all. That case must be shown explicitly:
  // silently falling through to the plain sign-in form (the old behavior) looks
  // exactly like "nothing happened" from the recipient's side.
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
  const inviteToken = hashParams.get("access_token");
  const inviteType = hashParams.get("type"); // invite | recovery | signup
  const hashError = hashParams.get("error_description") || hashParams.get("error");

  if (inviteToken && (inviteType === "invite" || inviteType === "recovery" || inviteType === "signup")) {
    renderSetPassword(inviteToken, hashParams.get("refresh_token"), hashParams.get("expires_in"), inviteType);
  } else if (hashError) {
    history.replaceState(null, "", location.pathname + location.search);
    renderSignIn(hashError.replace(/\+/g, " "));
  } else {
    // Already signed in? Skip straight past login.
    const existing = Admin.getSession();
    if (existing) {
      const params = new URLSearchParams(location.search);
      location.replace(params.get("next") || "index.html");
      return;
    }
    renderSignIn();
  }

  function renderSignIn(linkError) {
    cardbody.innerHTML = `
      <p class="lede">${I18n.t("login.lede")}</p>
      <div id="msg">${linkError
        ? `<div class="errbox">${I18n.t("login.link_invalid")}<br><span style="font-size:11px;opacity:.75;">${I18n.t("login.link_invalid_detail", { detail: Admin.esc(linkError) })}</span></div>`
        : ""}</div>
      <form id="form">
        <div class="field">
          <label for="email">${I18n.t("login.email")}</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">${I18n.t("login.password")}</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn primary" type="submit" id="submit" style="width:100%;justify-content:center;">${I18n.t("login.signin")}</button>
      </form>
      <p style="margin-top:14px;">
        <a href="#" id="forgot" style="font-size:12px;">${I18n.t("login.forgot")}</a>
      </p>
    `;
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = I18n.t("login.signin_progress");
      try {
        await Admin.signIn(document.getElementById("email").value.trim(), document.getElementById("password").value);
        const params = new URLSearchParams(location.search);
        location.href = params.get("next") || "index.html";
      } catch (err) {
        msg.innerHTML = `<div class="errbox">${Admin.esc(err.message)}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = I18n.t("login.signin");
      }
    });

    document.getElementById("forgot").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) { msg.innerHTML = `<div class="errbox">${I18n.t("login.forgot_email_required")}</div>`; return; }
      await Admin.requestPasswordReset(email);
      msg.innerHTML = `<div class="okbox">${I18n.t("login.reset_sent")}</div>`;
    });
  }

  function renderSetPassword(accessToken, refreshToken, expiresIn, type) {
    // Clear the token out of the visible URL/history right away — it's a live
    // credential and shouldn't linger in the address bar or browser history.
    history.replaceState(null, "", location.pathname + location.search);

    cardbody.innerHTML = `
      <p class="lede">${type === "recovery" ? I18n.t("login.set_password_recovery") : I18n.t("login.set_password_invite")}</p>
      <div id="msg"></div>
      <form id="pform">
        <div class="field">
          <label for="p1">${I18n.t("login.new_password")}</label>
          <input id="p1" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="p2">${I18n.t("login.confirm_password")}</label>
          <input id="p2" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button class="btn primary" type="submit" id="psubmit" style="width:100%;justify-content:center;">${I18n.t("login.set_password_submit")}</button>
      </form>
    `;
    const form = document.getElementById("pform");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("psubmit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.innerHTML = "";
      const p1 = document.getElementById("p1").value;
      const p2 = document.getElementById("p2").value;
      if (p1 !== p2) { msg.innerHTML = `<div class="errbox">${I18n.t("login.password_mismatch")}</div>`; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = I18n.t("login.setting_progress");
      try {
        await Admin.setPassword(accessToken, p1);
        Admin.adoptSession({ access_token: accessToken, refresh_token: refreshToken, expires_in: parseInt(expiresIn, 10) || 3600 });
        location.href = "index.html";
      } catch (err) {
        msg.innerHTML = `<div class="errbox">${Admin.esc(err.message)}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = I18n.t("login.set_password_submit");
      }
    });
  }
})();
</script>
</body>
</html>
