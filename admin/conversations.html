<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>会話ログ | AMASAS Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/admin.css">
</head>
<body>
<script src="shared/admin.js"></script>
<script>
(async function () {
  const ctx = await Admin.renderShell({ page: "conversations", title: "会話ログ", sub: "公開チャットのセッション・メッセージを閲覧します" });
  if (!ctx) return;
  const content = document.getElementById("content");
  const params = new URLSearchParams(location.search);
  const sessionId = params.get("session");

  if (sessionId) { renderThread(sessionId); } else { renderList(); }

  async function renderThread(id) {
    content.innerHTML = `<div class="loading">読み込み中…</div>`;
    try {
      const [session, messages] = await Promise.all([
        Admin.rest(`/rest/v1/amasas_chat_sessions?id=eq.${encodeURIComponent(id)}&select=*`).then((r) => r[0]),
        Admin.rest(`/rest/v1/amasas_chat_messages?session_id=eq.${encodeURIComponent(id)}&select=*&order=turn.asc`),
      ]);
      content.innerHTML = `
        <div class="toolbar"><a href="conversations.html" class="btn ghost sm">← 一覧に戻る</a><div class="spacer"></div></div>
        <div class="card" style="margin-bottom:16px;">
          <div class="formgrid">
            <div><label>ニックネーム</label>${Admin.esc((session && session.nickname) || "—")}</div>
            <div><label>あなたと海士町との関係</label>${Admin.esc((session && session.role_tag) || "—")}</div>
            <div><label>開始日時</label>${Admin.fmtDate(session && session.created_at)}</div>
            <div><label>セッションID</label><span class="mono" style="font-size:11px;">${Admin.esc(id)}</span></div>
          </div>
        </div>
        <div class="thread" id="thread"></div>
      `;
      const thread = document.getElementById("thread");
      if (!messages.length) {
        thread.innerHTML = `<div class="empty"><div class="big">💬</div>メッセージがありません</div>`;
        return;
      }
      thread.innerHTML = messages.map((m) => {
        const bodyHtml = window.marked ? marked.parse(m.content || "") : Admin.esc(m.content || "");
        const sqlLog = Array.isArray(m.sql_log) && m.sql_log.length ? `
          <details class="sql"><summary>SQL照会 ${m.sql_log.length}件${m.sql_log.some((e) => e.error) ? "（エラーあり）" : ""}</summary>
            ${m.sql_log.map((e) => `<pre>${Admin.esc(e.query || "")}\n${e.error ? "→ ERROR: " + Admin.esc(e.error) : "→ " + (e.rows ?? 0) + " rows"}</pre>`).join("")}
          </details>` : "";
        return `<div class="m ${m.role === "user" ? "user" : "assistant"}">
          ${bodyHtml}
          <div class="meta">#${m.turn} ・ ${Admin.fmtDate(m.created_at)}${m.model ? ` ・ <span class="mono">${Admin.esc(m.model)}</span>` : ""}${m.data_layer ? ` ・ <span class="mono">${Admin.esc(m.data_layer)}</span>` : ""}</div>
          ${sqlLog}
        </div>`;
      }).join("");
    } catch (err) {
      content.innerHTML = `<div class="errbox">読み込みに失敗しました: ${Admin.esc(err.message)}</div>`;
    }
  }

  async function renderList() {
    let state = { nickname: "", roleTag: "", from: "", to: "", limit: 20, offset: 0 };

    content.innerHTML = `
      <div class="toolbar">
        <input id="f-nickname" placeholder="ニックネームで検索" style="max-width:200px;" />
        <input id="f-roletag" placeholder="お立場で絞り込み" style="max-width:200px;" />
        <input id="f-from" type="date" title="開始日" style="max-width:150px;" />
        <input id="f-to" type="date" title="終了日" style="max-width:150px;" />
        <button class="btn ghost sm" id="apply">絞り込み</button>
        <button class="btn ghost sm" id="clear">クリア</button>
        <div class="spacer"></div>
      </div>
      <div id="list"><div class="loading">読み込み中…</div></div>
      <div class="pager">
        <span id="pageinfo"></span>
        <button class="btn ghost sm" id="prev">← 前へ</button>
        <button class="btn ghost sm" id="next">次へ →</button>
      </div>
    `;
    document.getElementById("apply").addEventListener("click", () => {
      state.nickname = document.getElementById("f-nickname").value.trim();
      state.roleTag = document.getElementById("f-roletag").value.trim();
      state.from = document.getElementById("f-from").value;
      state.to = document.getElementById("f-to").value;
      state.offset = 0;
      load();
    });
    document.getElementById("clear").addEventListener("click", () => {
      ["f-nickname", "f-roletag", "f-from", "f-to"].forEach((id) => (document.getElementById(id).value = ""));
      state = { nickname: "", roleTag: "", from: "", to: "", limit: 20, offset: 0 };
      load();
    });
    document.getElementById("prev").addEventListener("click", () => { state.offset = Math.max(0, state.offset - state.limit); load(); });
    document.getElementById("next").addEventListener("click", () => { state.offset += state.limit; load(); });

    async function load() {
      const list = document.getElementById("list");
      list.innerHTML = `<div class="loading">読み込み中…</div>`;
      try {
        const qs = [];
        if (state.nickname) qs.push(`nickname=ilike.*${encodeURIComponent(state.nickname)}*`);
        if (state.roleTag) qs.push(`role_tag=ilike.*${encodeURIComponent(state.roleTag)}*`);
        if (state.from) qs.push(`created_at=gte.${state.from}T00:00:00Z`);
        if (state.to) qs.push(`created_at=lte.${state.to}T23:59:59Z`);
        const filter = qs.length ? qs.join("&") + "&" : "";

        const [rows, total] = await Promise.all([
          Admin.rest(`/rest/v1/amasas_chat_sessions?${filter}select=*&order=created_at.desc&limit=${state.limit}&offset=${state.offset}`),
          Admin.restCount("amasas_chat_sessions", `${filter}select=id`),
        ]);

        const counts = await Promise.all(rows.map((s) => Admin.restCount("amasas_chat_messages", `session_id=eq.${encodeURIComponent(s.id)}&select=id`)));

        document.getElementById("pageinfo").textContent = total
          ? `${state.offset + 1}–${Math.min(state.offset + state.limit, total)} / ${total.toLocaleString("ja-JP")} 件`
          : "0 件";
        document.getElementById("prev").disabled = state.offset === 0;
        document.getElementById("next").disabled = state.offset + state.limit >= total;

        list.innerHTML = rows.length ? `
          <div class="tablewrap"><table class="dtable">
            <thead><tr><th>日時</th><th>ニックネーム</th><th>お立場</th><th class="num">メッセージ数</th><th></th></tr></thead>
            <tbody>${rows.map((s, i) => `
              <tr>
                <td>${Admin.fmtDate(s.created_at)}</td>
                <td>${Admin.esc(s.nickname || "—")}</td>
                <td>${Admin.esc(s.role_tag || "—")}</td>
                <td class="num">${counts[i]}</td>
                <td><a href="conversations.html?session=${encodeURIComponent(s.id)}">会話を見る →</a></td>
              </tr>`).join("")}</tbody>
          </table></div>
        ` : `<div class="empty"><div class="big">💬</div>条件に一致する会話がありません</div>`;
      } catch (err) {
        list.innerHTML = `<div class="errbox">読み込みに失敗しました: ${Admin.esc(err.message)}</div>`;
      }
    }
    load();
  }
})();
</script>
</body>
</html>
