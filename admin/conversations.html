<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>会話ログ | AMASAS Admin</title>
<script>document.documentElement.lang = localStorage.getItem("amasas_admin_lang") || "ja";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/admin.css">
</head>
<body>
<script src="shared/i18n.js"></script>
<script src="shared/admin.js"></script>
<script>
(async function () {
  document.title = I18n.t("conversations.title") + " | AMASAS Admin";
  const ctx = await Admin.renderShell({ page: "conversations", title: I18n.t("conversations.title"), sub: I18n.t("conversations.sub") });
  if (!ctx) return;
  const content = document.getElementById("content");
  const params = new URLSearchParams(location.search);
  const sessionId = params.get("session");

  if (sessionId) { renderThread(sessionId); } else { renderList(); }

  async function renderThread(id) {
    content.innerHTML = `<div class="loading">${I18n.t("common.loading")}</div>`;
    try {
      const [session, messages] = await Promise.all([
        Admin.rest(`/rest/v1/amasas_chat_sessions?id=eq.${encodeURIComponent(id)}&select=*`).then((r) => r[0]),
        Admin.rest(`/rest/v1/amasas_chat_messages?session_id=eq.${encodeURIComponent(id)}&select=*&order=turn.asc`),
      ]);
      content.innerHTML = `
        <div class="toolbar"><a href="conversations.html" class="btn ghost sm">${I18n.t("common.back_to_list")}</a><div class="spacer"></div></div>
        <div class="card" style="margin-bottom:16px;">
          <div class="formgrid">
            <div><label>${I18n.t("conversations.field.nickname")}</label>${Admin.esc((session && session.nickname) || "—")}</div>
            <div><label>${I18n.t("conversations.field.role_tag")}</label>${Admin.esc((session && session.role_tag) || "—")}</div>
            <div><label>${I18n.t("conversations.field.started_at")}</label>${Admin.fmtDate(session && session.created_at)}</div>
            <div><label>${I18n.t("conversations.field.session_id")}</label><span class="mono" style="font-size:11px;">${Admin.esc(id)}</span></div>
          </div>
        </div>
        <div class="thread" id="thread"></div>
      `;
      const thread = document.getElementById("thread");
      if (!messages.length) {
        thread.innerHTML = `<div class="empty"><div class="big">💬</div>${I18n.t("conversations.no_messages")}</div>`;
        return;
      }
      thread.innerHTML = messages.map((m) => {
        const bodyHtml = window.marked ? marked.parse(m.content || "") : Admin.esc(m.content || "");
        const sqlLog = Array.isArray(m.sql_log) && m.sql_log.length ? `
          <details class="sql"><summary>${I18n.t("conversations.sql_log_summary", {
            count: m.sql_log.length,
            queryWord: I18n.getLang() === "en" ? "quer" + (m.sql_log.length === 1 ? "y" : "ies") : "",
            errorNote: m.sql_log.some((e) => e.error) ? I18n.t("conversations.sql_log_has_error") : "",
          })}</summary>
            ${m.sql_log.map((e) => `<pre>${Admin.esc(e.query || "")}\n${e.error ? I18n.t("conversations.sql_log_error_prefix") + Admin.esc(e.error) : I18n.t("conversations.sql_log_rows", { n: e.rows ?? 0 })}</pre>`).join("")}
          </details>` : "";
        return `<div class="m ${m.role === "user" ? "user" : "assistant"}">
          ${bodyHtml}
          <div class="meta">#${m.turn} ・ ${Admin.fmtDate(m.created_at)}${m.model ? ` ・ <span class="mono">${Admin.esc(m.model)}</span>` : ""}${m.data_layer ? ` ・ <span class="mono">${Admin.esc(m.data_layer)}</span>` : ""}</div>
          ${sqlLog}
        </div>`;
      }).join("");
    } catch (err) {
      content.innerHTML = `<div class="errbox">${I18n.t("common.error_prefix", { msg: Admin.esc(err.message) })}</div>`;
    }
  }

  async function renderList() {
    let state = { nickname: "", roleTag: "", from: "", to: "", limit: 20, offset: 0 };

    content.innerHTML = `
      <div class="toolbar">
        <input id="f-nickname" placeholder="${I18n.t("conversations.filter.nickname")}" style="max-width:200px;" />
        <input id="f-roletag" placeholder="${I18n.t("conversations.filter.role_tag")}" style="max-width:200px;" />
        <input id="f-from" type="date" title="${I18n.t("conversations.filter.from")}" style="max-width:150px;" />
        <input id="f-to" type="date" title="${I18n.t("conversations.filter.to")}" style="max-width:150px;" />
        <button class="btn ghost sm" id="apply">${I18n.t("conversations.filter.apply")}</button>
        <button class="btn ghost sm" id="clear">${I18n.t("conversations.filter.clear")}</button>
        <div class="spacer"></div>
      </div>
      <div id="list"><div class="loading">${I18n.t("common.loading")}</div></div>
      <div class="pager">
        <span id="pageinfo"></span>
        <button class="btn ghost sm" id="prev">${I18n.t("common.prev")}</button>
        <button class="btn ghost sm" id="next">${I18n.t("common.next")}</button>
      </div>
    `;
    document.getElementById("apply").addEventListener("click", () => {
      state.nickname = document.getElementById("f-nickname").value.trim();
      state.roleTag = document.getElementById("f-roletag").value.trim();
      state.from = document.getElementById("f-from").value;
      state.to = document.getElementById("f-to").value;
      state.offset = 0;
      load();
    });
    document.getElementById("clear").addEventListener("click", () => {
      ["f-nickname", "f-roletag", "f-from", "f-to"].forEach((id) => (document.getElementById(id).value = ""));
      state = { nickname: "", roleTag: "", from: "", to: "", limit: 20, offset: 0 };
      load();
    });
    document.getElementById("prev").addEventListener("click", () => { state.offset = Math.max(0, state.offset - state.limit); load(); });
    document.getElementById("next").addEventListener("click", () => { state.offset += state.limit; load(); });

    async function load() {
      const list = document.getElementById("list");
      list.innerHTML = `<div class="loading">${I18n.t("common.loading")}</div>`;
      try {
        const qs = [];
        if (state.nickname) qs.push(`nickname=ilike.*${encodeURIComponent(state.nickname)}*`);
        if (state.roleTag) qs.push(`role_tag=ilike.*${encodeURIComponent(state.roleTag)}*`);
        if (state.from) qs.push(`created_at=gte.${state.from}T00:00:00Z`);
        if (state.to) qs.push(`created_at=lte.${state.to}T23:59:59Z`);
        const filter = qs.length ? qs.join("&") + "&" : "";

        const [rows, total] = await Promise.all([
          Admin.rest(`/rest/v1/amasas_chat_sessions?${filter}select=*&order=created_at.desc&limit=${state.limit}&offset=${state.offset}`),
          Admin.restCount("amasas_chat_sessions", `${filter}select=id`),
        ]);

        const counts = await Promise.all(rows.map((s) => Admin.restCount("amasas_chat_messages", `session_id=eq.${encodeURIComponent(s.id)}&select=id`)));

        document.getElementById("pageinfo").textContent = total
          ? I18n.t("common.count_range", { from: state.offset + 1, to: Math.min(state.offset + state.limit, total), total: Admin.fmtNum(total) })
          : I18n.t("common.count_zero");
        document.getElementById("prev").disabled = state.offset === 0;
        document.getElementById("next").disabled = state.offset + state.limit >= total;

        list.innerHTML = rows.length ? `
          <div class="tablewrap"><table class="dtable">
            <thead><tr><th>${I18n.t("dashboard.th.datetime")}</th><th>${I18n.t("dashboard.th.nickname")}</th><th>${I18n.t("dashboard.th.role_tag")}</th><th class="num">${I18n.t("conversations.th.message_count")}</th><th></th></tr></thead>
            <tbody>${rows.map((s, i) => `
              <tr>
                <td>${Admin.fmtDate(s.created_at)}</td>
                <td>${Admin.esc(s.nickname || "—")}</td>
                <td>${Admin.esc(s.role_tag || "—")}</td>
                <td class="num">${counts[i]}</td>
                <td><a href="conversations.html?session=${encodeURIComponent(s.id)}">${I18n.t("common.view_conversation")}</a></td>
              </tr>`).join("")}</tbody>
          </table></div>
        ` : `<div class="empty"><div class="big">💬</div>${I18n.t("conversations.no_results")}</div>`;
      } catch (err) {
        list.innerHTML = `<div class="errbox">${I18n.t("common.error_prefix", { msg: Admin.esc(err.message) })}</div>`;
      }
    }
    load();
  }
})();
</script>
</body>
</html>
