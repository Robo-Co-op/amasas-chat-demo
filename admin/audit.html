<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>監査ログ | AMASAS Admin</title>
<script>
// This repo deploys under 3 separate Vercel accounts (see index.html) --
// redirect visitors on the two we don't control to the canonical domain.
// Preserves the path, so /admin/* deep links keep working after redirect.
if (/-robo-co-op-team\.vercel\.app$/.test(location.hostname) || /-dimdimlians-projects\.vercel\.app$/.test(location.hostname)) {
  location.replace("https://amasas-chat-demo-7bk6.vercel.app" + location.pathname + location.search + location.hash);
}
</script>
<script>document.documentElement.lang = localStorage.getItem("amasas_admin_lang") || "ja";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/admin.css">
</head>
<body>
<script src="shared/i18n.js"></script>
<script src="shared/admin.js"></script>
<script>
(async function () {
  document.title = I18n.t("audit.title") + " | AMASAS Admin";
  const ctx = await Admin.renderShell({ page: "audit", title: I18n.t("audit.title"), sub: I18n.t("audit.sub") });
  if (!ctx) return;
  const content = document.getElementById("content");

  let offset = 0;
  const limit = 50;

  content.innerHTML = `
    <div id="list"><div class="loading">${I18n.t("common.loading")}</div></div>
    <div class="pager">
      <span id="pageinfo"></span>
      <button class="btn ghost sm" id="prev">${I18n.t("common.prev")}</button>
      <button class="btn ghost sm" id="next">${I18n.t("common.next")}</button>
    </div>
  `;
  document.getElementById("prev").addEventListener("click", () => { offset = Math.max(0, offset - limit); load(); });
  document.getElementById("next").addEventListener("click", () => { offset += limit; load(); });

  async function load() {
    const list = document.getElementById("list");
    list.innerHTML = `<div class="loading">${I18n.t("common.loading")}</div>`;
    try {
      const rows = await Admin.rpc("admin_list_audit_log", { limit_n: limit, offset_n: offset });
      document.getElementById("pageinfo").textContent = I18n.t("audit.count_range", { from: offset + 1, to: offset + rows.length });
      document.getElementById("prev").disabled = offset === 0;
      document.getElementById("next").disabled = rows.length < limit;

      list.innerHTML = rows.length ? `
        <div class="tablewrap"><table class="dtable">
          <thead><tr><th>${I18n.t("audit.th.datetime")}</th><th>${I18n.t("audit.th.actor")}</th><th>${I18n.t("audit.th.action")}</th><th>${I18n.t("audit.th.target")}</th><th></th></tr></thead>
          <tbody>${rows.map((a, i) => `
            <tr>
              <td>${Admin.fmtDate(a.created_at)}</td>
              <td>${Admin.esc(a.actor_email || "—")}</td>
              <td class="mono" style="font-size:12px;">${Admin.esc(a.action)}</td>
              <td class="mono" style="font-size:12px;">${Admin.esc(a.target || "—")}</td>
              <td><button class="btn ghost sm" data-i="${i}">${I18n.t("common.details")}</button></td>
            </tr>
            <tr id="detail-${i}" style="display:none;"><td colspan="5"><pre style="background:var(--surface-2);padding:10px;border-radius:8px;overflow-x:auto;font-size:11px;">${Admin.esc(JSON.stringify(a.details, null, 2))}</pre></td></tr>
          `).join("")}</tbody>
        </table></div>
      ` : `<div class="empty"><div class="big">📜</div>${I18n.t("audit.no_records")}</div>`;

      list.querySelectorAll("button[data-i]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const row = document.getElementById(`detail-${btn.dataset.i}`);
          row.style.display = row.style.display === "none" ? "" : "none";
        });
      });
    } catch (err) {
      list.innerHTML = `<div class="errbox">${I18n.t("common.error_prefix", { msg: Admin.esc(err.message) })}</div>`;
    }
  }
  load();
})();
</script>
</body>
</html>
