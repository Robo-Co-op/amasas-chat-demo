<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ダッシュボード | AMASAS Admin</title>
<script>
// This repo deploys under 3 separate Vercel accounts (see index.html) --
// redirect visitors on the two we don't control to the canonical domain.
// Preserves the path, so /admin/* deep links keep working after redirect.
if (/-robo-co-op-team\.vercel\.app$/.test(location.hostname) || /-dimdimlians-projects\.vercel\.app$/.test(location.hostname)) {
  location.replace("https://amasas-chat-demo-7bk6.vercel.app" + location.pathname + location.search + location.hash);
}
</script>
<script>document.documentElement.lang = localStorage.getItem("amasas_admin_lang") || "ja";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/admin.css">
</head>
<body>
<script src="shared/i18n.js"></script>
<script src="shared/admin.js"></script>
<script>
(async function () {
  document.title = I18n.t("dashboard.title") + " | AMASAS Admin";
  const ctx = await Admin.renderShell({ page: "dashboard", title: I18n.t("dashboard.title"), sub: I18n.t("dashboard.sub") });
  if (!ctx) return;
  const content = document.getElementById("content");

  const iso = (daysAgo) => new Date(Date.now() - daysAgo * 86400000).toISOString();
  const num = Admin.fmtNum;

  content.innerHTML = `<div class="loading">${I18n.t("dashboard.aggregating")}</div>`;

  const canSeeAnalytics = Admin.can(ctx.role, "analytics");

  try {
    const [
      sessionsTotal, sessions7d, sessions30d,
      messagesTotal, feedbackOk, feedbackNg,
      recentSessions, recentNg, sampleMessages,
      maintenance,
      analyticsSummary, analyticsDau, analyticsSeries,
    ] = await Promise.all([
      Admin.restCount("amasas_chat_sessions", "select=id"),
      Admin.restCount("amasas_chat_sessions", `select=id&created_at=gte.${iso(7)}`),
      Admin.restCount("amasas_chat_sessions", `select=id&created_at=gte.${iso(30)}`),
      Admin.restCount("amasas_chat_messages", "select=id"),
      Admin.restCount("amasas_chat_feedback", "verdict=eq.ok&select=id"),
      Admin.restCount("amasas_chat_feedback", "verdict=eq.ng&select=id"),
      Admin.rest("/rest/v1/amasas_chat_sessions?select=*&order=created_at.desc&limit=8"),
      Admin.rest("/rest/v1/amasas_chat_feedback?select=*&verdict=eq.ng&order=created_at.desc&limit=5"),
      Admin.rest("/rest/v1/amasas_chat_messages?select=model,data_layer,sql_log&role=eq.assistant&order=created_at.desc&limit=500"),
      Admin.rpc("amasas_maintenance_status").catch(() => null),
      canSeeAnalytics ? Admin.rpc("admin_analytics_summary", { from_ts: iso(30), to_ts: new Date().toISOString() }).catch(() => null) : null,
      canSeeAnalytics ? Admin.rpc("admin_analytics_summary", { from_ts: iso(1), to_ts: new Date().toISOString() }).catch(() => null) : null,
      canSeeAnalytics ? Admin.rpc("admin_analytics_timeseries", { from_ts: iso(30), to_ts: new Date().toISOString(), granularity: "day" }).catch(() => null) : null,
    ]);

    let health = null;
    try {
      const s = await Admin.ensureToken();
      const r = await fetch("/api/admin/health", { headers: { Authorization: `Bearer ${s.access_token}` } });
      if (r.ok) health = await r.json();
    } catch { /* health panel is best-effort */ }

    // Fetch the referenced messages for the negative-feedback preview list.
    const msgIds = [...new Set(recentNg.map((f) => f.message_id))];
    let msgById = {};
    if (msgIds.length) {
      const rows = await Admin.rest(`/rest/v1/amasas_chat_messages?select=id,content,session_id,nickname,role_tag&id=in.(${msgIds.join(",")})`);
      msgById = Object.fromEntries(rows.map((r) => [r.id, r]));
    }

    const feedbackTotal = feedbackOk + feedbackNg;
    const satisfaction = feedbackTotal ? Math.round((feedbackOk / feedbackTotal) * 100) : null;

    const modelTally = {}, layerTally = {};
    let errorCount = 0;
    for (const m of sampleMessages) {
      if (m.model) modelTally[m.model] = (modelTally[m.model] || 0) + 1;
      if (m.data_layer) layerTally[m.data_layer] = (layerTally[m.data_layer] || 0) + 1;
      if (Array.isArray(m.sql_log) && m.sql_log.some((e) => e && e.error)) errorCount++;
    }
    const barRow = (tally, total) => Object.entries(tally).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
      <div style="display:flex;align-items:center;gap:10px;margin:6px 0;">
        <div class="mono" style="width:150px;font-size:12px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${Admin.esc(k)}</div>
        <div style="flex:1;background:var(--surface-2);border-radius:6px;height:8px;overflow:hidden;">
          <div style="width:${total ? (v / total) * 100 : 0}%;background:var(--teal);height:100%;"></div>
        </div>
        <div class="mono" style="width:44px;text-align:right;font-size:12px;color:var(--ink-2);">${v}</div>
      </div>`).join("") || `<div class="loading">${I18n.t("dashboard.no_data")}</div>`;

    const healthChip = (okBool, label) =>
      `<span class="badge ${okBool ? "ok" : "ng"}">${okBool ? "✓" : "✕"} ${Admin.esc(label)}</span>`;

    content.innerHTML = `
      ${maintenance && maintenance.enabled ? `<div class="errbox">${I18n.t("dashboard.maintenance_banner")}</div>` : ""}

      <div class="grid kpis">
        <div class="card kpi"><div class="label">${I18n.t("dashboard.kpi.sessions_total")}</div><div class="value">${num(sessionsTotal)}</div><div class="note">${I18n.t("dashboard.kpi.sessions_note", { d7: num(sessions7d), d30: num(sessions30d) })}</div></div>
        <div class="card kpi"><div class="label">${I18n.t("dashboard.kpi.messages_total")}</div><div class="value">${num(messagesTotal)}</div><div class="note">${I18n.t("dashboard.kpi.messages_note")}</div></div>
        <div class="card kpi"><div class="label">${I18n.t("dashboard.kpi.feedback")}</div><div class="value">${satisfaction !== null ? satisfaction + "%" : "—"}</div><div class="note">${satisfaction !== null ? I18n.t("dashboard.kpi.feedback_note", { ok: num(feedbackOk), ng: num(feedbackNg) }) : I18n.t("dashboard.kpi.feedback_none")}</div></div>
        <div class="card kpi"><div class="label">${I18n.t("dashboard.kpi.sql_error_rate")}</div><div class="value">${sampleMessages.length ? Math.round((errorCount / sampleMessages.length) * 100) + "%" : "—"}</div><div class="note">${I18n.t("dashboard.kpi.sql_error_note", { n: num(errorCount) })}</div></div>
      </div>

      ${canSeeAnalytics && analyticsSummary && analyticsSeries ? `
      <h2 class="section">${I18n.t("dashboard.analytics_preview_heading")}</h2>
      <div class="card">
        <div style="display:flex;gap:28px;flex-wrap:wrap;margin-bottom:14px;">
          <div><div style="font-size:12px;color:var(--ink-2);">${I18n.t("analytics.kpi.unique_visitors")}</div><div class="mono" style="font-size:22px;font-weight:500;">${num(analyticsSummary.unique_visitors)}</div></div>
          <div><div style="font-size:12px;color:var(--ink-2);">${I18n.t("analytics.dau")}</div><div class="mono" style="font-size:22px;font-weight:500;">${analyticsDau ? num(analyticsDau.unique_visitors) : "—"}</div></div>
          <div><div style="font-size:12px;color:var(--ink-2);">${I18n.t("analytics.kpi.new_visitors")}</div><div class="mono" style="font-size:22px;font-weight:500;">${num(analyticsSummary.new_visitors)}</div></div>
        </div>
        ${Admin.lineChart([
          { name: I18n.t("analytics.kpi.unique_visitors"), color: "#0f766e", values: analyticsSeries.map((p) => p.unique_visitors) },
          { name: I18n.t("analytics.kpi.new_visitors"), color: "#2C6A51", values: analyticsSeries.map((p) => p.new_visitors) },
        ], analyticsSeries.map((p) => p.bucket)) || `<div class="loading">${I18n.t("dashboard.no_data")}</div>`}
        <p style="margin:10px 0 0;"><a href="analytics.html">${I18n.t("dashboard.view_full_analytics")}</a></p>
      </div>
      ` : ""}

      <h2 class="section">${I18n.t("dashboard.system_status")}</h2>
      <div class="card">
        ${health ? `
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
            ${healthChip(health.geminiKeyConfigured, "GEMINI_API_KEY")}
            ${healthChip(health.serviceKeyConfigured, "SUPABASE_SERVICE_KEY")}
            ${healthChip(health.dbReachable, I18n.t("dashboard.health.db_reachable"))}
            <span class="badge layer">${Admin.esc(health.vercelEnv)}</span>
          </div>
          <div style="font-size:13px;color:var(--ink-2);">
            ${I18n.t("dashboard.model_summary", {
              model: `<span class="mono">${Admin.esc(health.geminiModel)}</span>`,
              fallback: `<span class="mono">${Admin.esc(health.geminiFallbackModel)}</span>`,
              layer: `<span class="mono">${Admin.esc(health.dataLayer)}</span>`,
            })}
          </div>
        ` : `<div class="loading">${I18n.t("dashboard.system_status_unavailable")}</div>`}
      </div>

      <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:20px;">
        <div class="card">
          <h2 class="section" style="margin-top:0;">${I18n.t("dashboard.model_usage")}</h2>
          ${barRow(modelTally, sampleMessages.length)}
        </div>
        <div class="card">
          <h2 class="section" style="margin-top:0;">${I18n.t("dashboard.data_layer_usage")}</h2>
          ${barRow(layerTally, sampleMessages.length)}
        </div>
      </div>

      <h2 class="section">${I18n.t("dashboard.recent_sessions")}</h2>
      ${recentSessions.length ? `
      <div class="tablewrap"><table class="dtable">
        <thead><tr><th>${I18n.t("dashboard.th.datetime")}</th><th>${I18n.t("dashboard.th.nickname")}</th><th>${I18n.t("dashboard.th.role_tag")}</th><th></th></tr></thead>
        <tbody>${recentSessions.map((s) => `
          <tr>
            <td>${Admin.fmtDate(s.created_at)}</td>
            <td>${Admin.esc(s.nickname || "—")}</td>
            <td>${Admin.esc(s.role_tag || "—")}</td>
            <td><a href="conversations.html?session=${encodeURIComponent(s.id)}">${I18n.t("common.view_conversation")}</a></td>
          </tr>`).join("")}</tbody>
      </table></div>` : `<div class="empty"><div class="big">💬</div>${I18n.t("dashboard.no_conversations")}</div>`}

      <h2 class="section">${I18n.t("dashboard.ng_feedback_title")}</h2>
      ${recentNg.length ? `
      <div class="tablewrap"><table class="dtable">
        <thead><tr><th>${I18n.t("dashboard.th.datetime")}</th><th>${I18n.t("dashboard.th.speaker")}</th><th>${I18n.t("dashboard.th.answer")}</th><th>${I18n.t("dashboard.th.comment")}</th><th></th></tr></thead>
        <tbody>${recentNg.map((f) => {
          const m = msgById[f.message_id];
          return `<tr>
            <td>${Admin.fmtDate(f.created_at)}</td>
            <td>${Admin.esc((m && (m.nickname || m.role_tag)) || "—")}</td>
            <td style="max-width:320px;">${Admin.esc((m && m.content || "").slice(0, 90))}${m && m.content && m.content.length > 90 ? "…" : ""}</td>
            <td>${Admin.esc(f.comment || "—")}</td>
            <td>${m ? `<a href="conversations.html?session=${encodeURIComponent(m.session_id)}">${I18n.t("common.view_conversation")}</a>` : "—"}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div class="empty"><div class="big">✓</div>${I18n.t("dashboard.ng_feedback_none")}</div>`}
    `;
  } catch (err) {
    content.innerHTML = `<div class="errbox">${I18n.t("common.error_prefix", { msg: Admin.esc(err.message) })}</div>`;
  }
})();
</script>
</body>
</html>
