<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ナレッジ | AMASAS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/admin.css">
</head>
<body>
<script src="shared/admin.js"></script>
<script>
// Schema-driven editor for the 8 knowledge.* tables (columns/constraints
// mirrored from supabase/migrations/0003_amasas_schema.sql). One generic
// table+form component instead of 8 bespoke ones.
const TABLES = [
  { key: "measures", label: "物差し・出典台帳", pk: "measure_key", note: "l4層のプロンプトに注入されます。", fields: [
    { name: "measure_key", label: "キー", type: "text", required: true },
    { name: "name_ja", label: "名称", type: "text", required: true },
    { name: "definition_ja", label: "定義", type: "textarea", required: true },
    { name: "caveat_ja", label: "注意点", type: "textarea" },
    { name: "priority", label: "優先度", type: "int" },
    { name: "publisher", label: "発行元", type: "text" },
    { name: "url", label: "URL", type: "text" },
    { name: "verification", label: "検証状態", type: "select", options: ["verified", "partially_verified", "unverified", "circular", "private", "internal"] },
    { name: "verified_on", label: "検証日", type: "date" },
  ]},
  { key: "town_facts", label: "公式事実", pk: "fact_key", note: "l4層のプロンプトに注入されます。", fields: [
    { name: "fact_key", label: "キー", type: "text", required: true },
    { name: "statement_ja", label: "内容", type: "textarea", required: true },
    { name: "measure_key", label: "関連する物差しキー", type: "text" },
    { name: "source_ja", label: "出典", type: "text", required: true },
    { name: "year_label", label: "年ラベル", type: "text" },
    { name: "priority", label: "優先度", type: "int" },
    { name: "source_ref", label: "出典参照", type: "text" },
    { name: "valid_from", label: "有効開始日", type: "date" },
    { name: "kind", label: "種別", type: "select", options: ["fact", "unknown", "assumption"], required: true },
    { name: "caveat_ja", label: "注意点", type: "textarea" },
  ]},
  { key: "strategy_frames", label: "公式フレーム", pk: "frame", note: "l4層のプロンプトに注入されます。", fields: [
    { name: "frame", label: "フレーム名", type: "text", required: true },
    { name: "industries_ja", label: "対象産業", type: "textarea", required: true },
    { name: "policy_stance_ja", label: "政策スタンス", type: "textarea", required: true },
    { name: "guardrail_ja", label: "ガードレール", type: "textarea", required: true },
    { name: "kpi_ja", label: "KPI", type: "text" },
    { name: "related_tables", label: "関連テーブル（カンマ区切り）", type: "array" },
    { name: "source_ref", label: "出典参照", type: "text" },
  ]},
  { key: "strategy_pillars", label: "12戦略", pk: "pillar_no", note: "l4層のプロンプトに注入されます。", fields: [
    { name: "pillar_no", label: "戦略番号", type: "int", required: true },
    { name: "pillar_ja", label: "戦略名", type: "text", required: true },
    { name: "aim_ja", label: "狙い", type: "textarea", required: true },
    { name: "key_actions_ja", label: "主要施策", type: "textarea", required: true },
    { name: "targets_ja", label: "目標", type: "textarea", required: true },
    { name: "actors_ja", label: "主体", type: "text", required: true },
    { name: "source_ref", label: "出典参照", type: "text" },
  ]},
  { key: "involvement_paths", label: "関わりしろ", pk: "path_key", note: "l4層のプロンプトに注入されます。", fields: [
    { name: "path_key", label: "キー", type: "text", required: true },
    { name: "path_ja", label: "名称", type: "text", required: true },
    { name: "description_ja", label: "説明", type: "textarea", required: true },
    { name: "target_profile_ja", label: "対象者像", type: "text" },
    { name: "pillar_no", label: "関連戦略番号", type: "int" },
    { name: "kpi_ja", label: "KPI", type: "text" },
    { name: "source_ref", label: "出典参照", type: "text" },
  ]},
  { key: "map_assets", label: "地図・図面", pk: "asset_key", note: "public_url がある行は、回答に画像として直接表示されます。", fields: [
    { name: "asset_key", label: "キー", type: "text", required: true },
    { name: "doc_ref", label: "出典文書", type: "text", required: true },
    { name: "title_ja", label: "タイトル", type: "text", required: true },
    { name: "page", label: "ページ", type: "int", required: true },
    { name: "public_url", label: "画像URL", type: "text" },
    { name: "description_ja", label: "説明", type: "textarea", required: true },
    { name: "caveat_ja", label: "注意点", type: "textarea" },
  ]},
  { key: "reading_playbook", label: "回答の組み立て方", pk: "entry_key", note: "l4層のプロンプトに注入されます。", fields: [
    { name: "entry_key", label: "キー", type: "text", required: true },
    { name: "kind", label: "種別", type: "select", options: ["observation", "interpretation", "pattern"], required: true },
    { name: "name_ja", label: "名称", type: "text", required: true },
    { name: "question_ja", label: "想定質問", type: "text" },
    { name: "how_ja", label: "手順", type: "textarea", required: true },
    { name: "example_ja", label: "例", type: "textarea" },
    { name: "caveat_ja", label: "注意点", type: "textarea" },
    { name: "moves", label: "手法タグ（カンマ区切り）", type: "array" },
    { name: "frame_hint_ja", label: "フレームのヒント", type: "text" },
    { name: "output_shape_ja", label: "出力の型", type: "text" },
    { name: "source_ref", label: "出典参照", type: "text", required: true },
    { name: "priority", label: "優先度", type: "int" },
  ]},
  { key: "source_registry", label: "出典台帳", pk: "source_key", note: "現在AIプロンプトには注入されません（出典管理用）。", fields: [
    { name: "source_key", label: "キー", type: "text", required: true },
    { name: "name_ja", label: "名称", type: "text", required: true },
    { name: "publisher", label: "発行元", type: "text" },
    { name: "published_on", label: "発行日", type: "date" },
    { name: "url", label: "URL", type: "text" },
    { name: "verification", label: "検証状態", type: "select", options: ["verified", "unverified", "circular", "private", "unavailable"], required: true },
    { name: "verified_on", label: "検証日", type: "date" },
    { name: "note_ja", label: "備考", type: "textarea" },
  ]},
];

(async function () {
  const ctx = await Admin.renderShell({ page: "knowledge_view", title: "ナレッジベース", sub: "AIの回答（l4データ層）に注入される町の公式コンテンツを編集します" });
  if (!ctx) return;
  const canEdit = Admin.can(ctx.role, "knowledge_edit");
  const content = document.getElementById("content");

  let active = TABLES[0].key;

  content.innerHTML = `
    <div class="tabs" id="tabs"></div>
    <div id="tablebody"></div>
  `;
  const tabsEl = document.getElementById("tabs");
  TABLES.forEach((t) => {
    const b = document.createElement("button");
    b.textContent = t.label;
    b.className = t.key === active ? "active" : "";
    b.addEventListener("click", () => { active = t.key; renderTab(); });
    b.dataset.key = t.key;
    tabsEl.appendChild(b);
  });

  function setActiveTabButton() {
    [...tabsEl.children].forEach((b) => b.classList.toggle("active", b.dataset.key === active));
  }

  async function renderTab() {
    setActiveTabButton();
    const table = TABLES.find((t) => t.key === active);
    const body = document.getElementById("tablebody");
    body.innerHTML = `<div class="loading">読み込み中…</div>`;
    try {
      const orderCol = table.fields.find((f) => f.name === "priority") ? "priority" : table.pk;
      const rows = await Admin.rpc("amasas_query", { query: `select * from knowledge.${table.key} order by ${orderCol}` });
      if (!Array.isArray(rows)) throw new Error((rows && rows.error) || "取得に失敗しました");

      const cols = table.fields.slice(0, 5); // keep the list view scannable; full record is in the edit form
      body.innerHTML = `
        <div class="toolbar">
          <div class="sub" style="font-size:12px;color:var(--ink-2);">${Admin.esc(table.note || "")}</div>
          <div class="spacer"></div>
          ${canEdit ? `<button class="btn primary sm" id="addrow">+ 新規追加</button>` : ""}
        </div>
        ${rows.length ? `
        <div class="tablewrap"><table class="dtable">
          <thead><tr>${cols.map((c) => `<th>${Admin.esc(c.label)}</th>`).join("")}<th></th></tr></thead>
          <tbody>${rows.map((r, i) => `<tr data-i="${i}">
            ${cols.map((c) => `<td>${Admin.esc(String(r[c.name] ?? "—")).slice(0, 80)}</td>`).join("")}
            <td style="white-space:nowrap;">
              <button class="btn ghost sm" data-act="view" data-i="${i}">詳細</button>
              ${canEdit ? `<button class="btn ghost sm" data-act="edit" data-i="${i}">編集</button><button class="btn danger sm" data-act="del" data-i="${i}">削除</button>` : ""}
            </td>
          </tr>`).join("")}</tbody>
        </table></div>` : `<div class="empty"><div class="big">📄</div>データがありません</div>`}
      `;

      if (canEdit) document.getElementById("addrow").addEventListener("click", () => openForm(table, null));
      body.querySelectorAll("button[data-act]").forEach((btn) => {
        const row = rows[parseInt(btn.dataset.i, 10)];
        btn.addEventListener("click", () => {
          if (btn.dataset.act === "view") openForm(table, row, true);
          if (btn.dataset.act === "edit") openForm(table, row, false);
          if (btn.dataset.act === "del") deleteRow(table, row);
        });
      });
    } catch (err) {
      body.innerHTML = `<div class="errbox">読み込みに失敗しました: ${Admin.esc(err.message)}</div>`;
    }
  }

  async function deleteRow(table, row) {
    const pkVal = row[table.pk];
    const ok = await Admin.confirmModal({
      title: "この行を削除しますか？",
      body: `<p style="font-size:13px;color:var(--ink-2);">knowledge.${Admin.esc(table.key)} / ${Admin.esc(table.pk)} = <span class="mono">${Admin.esc(pkVal)}</span><br>この操作は取り消せません。監査ログに記録されます。</p>`,
      confirmLabel: "削除する",
      danger: true,
    });
    if (!ok) return;
    try {
      await Admin.rpc("admin_knowledge_delete", { table_name: table.key, pk_value: String(pkVal) });
      Admin.toast("削除しました", "ok");
      renderTab();
    } catch (err) {
      Admin.toast(err.message, "err");
    }
  }

  function openForm(table, row, readOnly) {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    const isNew = !row;
    backdrop.innerHTML = `<div class="modal" style="max-width:640px;">
      <h3>${isNew ? "新規追加" : readOnly ? "詳細" : "編集"} — ${Admin.esc(table.label)}</h3>
      <div id="formfields" class="formgrid"></div>
      <div class="actions">
        <button class="btn ghost" data-a="cancel" type="button">閉じる</button>
        ${!readOnly ? `<button class="btn primary" data-a="save" type="button">保存</button>` : ""}
      </div>
    </div>`;
    document.body.appendChild(backdrop);
    const fieldsEl = backdrop.querySelector("#formfields");

    table.fields.forEach((f) => {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const val = row ? row[f.name] : (f.default ?? "");
      let inputHtml;
      const dis = readOnly ? "disabled" : "";
      if (f.type === "textarea") {
        inputHtml = `<textarea data-f="${f.name}" ${dis}>${Admin.esc(val ?? "")}</textarea>`;
      } else if (f.type === "select") {
        inputHtml = `<select data-f="${f.name}" ${dis}>
          <option value="">—</option>
          ${f.options.map((o) => `<option value="${o}" ${val === o ? "selected" : ""}>${o}</option>`).join("")}
        </select>`;
      } else if (f.type === "date") {
        const d = val ? String(val).slice(0, 10) : "";
        inputHtml = `<input type="date" data-f="${f.name}" value="${d}" ${dis} />`;
      } else if (f.type === "int") {
        inputHtml = `<input type="number" step="1" data-f="${f.name}" value="${val ?? ""}" ${dis} />`;
      } else if (f.type === "array") {
        const s = Array.isArray(val) ? val.join(", ") : (val ?? "");
        inputHtml = `<input type="text" data-f="${f.name}" value="${Admin.esc(s)}" ${dis} />`;
      } else {
        inputHtml = `<input type="text" data-f="${f.name}" value="${Admin.esc(val ?? "")}" ${f.name === table.pk && !isNew ? "disabled" : dis} />`;
      }
      wrap.innerHTML = `<label>${Admin.esc(f.label)}${f.required ? " *" : ""}</label>${inputHtml}`;
      fieldsEl.appendChild(wrap);
    });

    backdrop.addEventListener("click", async (e) => {
      if (e.target === backdrop || e.target.dataset.a === "cancel") { backdrop.remove(); return; }
      if (e.target.dataset.a === "save") {
        const data = {};
        table.fields.forEach((f) => {
          const el = fieldsEl.querySelector(`[data-f="${f.name}"]`);
          if (!el || el.disabled) { if (row && f.name === table.pk) data[f.name] = row[f.name]; return; }
          let v = el.value;
          if (v === "") { data[f.name] = null; return; }
          if (f.type === "int") data[f.name] = parseInt(v, 10);
          else if (f.type === "array") data[f.name] = v.split(",").map((s) => s.trim()).filter(Boolean);
          else data[f.name] = v;
        });
        const missing = table.fields.filter((f) => f.required && (data[f.name] === null || data[f.name] === undefined || data[f.name] === ""));
        if (missing.length) { Admin.toast(`必須項目が未入力です: ${missing.map((f) => f.label).join("、")}`, "err"); return; }
        try {
          await Admin.rpc("admin_knowledge_upsert", { table_name: table.key, row_data: data });
          Admin.toast("保存しました", "ok");
          backdrop.remove();
          renderTab();
        } catch (err) {
          Admin.toast(err.message, "err");
        }
      }
    });
  }

  renderTab();
})();
</script>
</body>
</html>
